<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to manage your Profile Manager account.">
    <title>Login - Profile Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <h1>Welcome Back</h1>
        <p class="intro">Log in to manage your profile.</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>

            <p id="loginMessage" class="message" role="alert" hidden></p>
            <button type="submit" id="loginButton">Login</button>
        </form>

        <p class="auth-switch">Don't have an account?
            <a href="register.html">Register here</a>
        </p>
    </main>
</body>
</html>
